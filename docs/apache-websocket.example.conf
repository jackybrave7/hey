# Пример: Apache 2.4 перед Node.js (HEY на localhost:3001)
# Включите модули: sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite
#
# Вставьте в VirtualHost для hey-messenger.ru (или Include из sites-available).

<VirtualHost *:443>
    ServerName hey-messenger.ru

    # SSL — ваши сертификаты (certbot / Let's Encrypt и т.д.)
    # SSLEngine on
    # SSLCertificateFile ...
    # SSLCertificateKeyFile ...

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # WebSocket — ОБЯЗАТЕЛЬНО до общего ProxyPass /
    ProxyPass        /ws  ws://127.0.0.1:3001/ws
    ProxyPassReverse /ws  ws://127.0.0.1:3001/ws

    # HTTP API + статика (Express)
    ProxyPass        /  http://127.0.0.1:3001/
    ProxyPassReverse /  http://127.0.0.1:3001/

    # Таймауты: мобильные сети и долгие WS-сессии
    ProxyTimeout 3600

    # Для mod_proxy_wstunnel — не обрывать idle-соединение слишком рано
    <Location /ws>
        ProxyPass ws://127.0.0.1:3001/ws
        ProxyPassReverse ws://127.0.0.1:3001/ws
        # Требуются заголовки Upgrade (Apache 2.4.47+ часто сам; иначе — mod_proxy_wstunnel)
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/ws(.*)$ ws://127.0.0.1:3001/ws$1 [P,L]
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/hey-error.log
    CustomLog ${APACHE_LOG_DIR}/hey-access.log combined
</VirtualHost>

# Проверка после правок:
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   curl -i https://hey-messenger.ru/health
#   wscat -c "wss://hey-messenger.ru/ws?token=..."  (с валидным JWT)
