    # SW никогда не кешировать — иначе фиксы push'а не доезжают до
    # устройств часами/днями. updateViaCache:'none' на клиенте этого
    # тоже требует, но nginx-уровень бронебойнее.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires 0;
        try_files $uri =404;
    }

