    # ── S3 proxy: отдаём медиа с нашего домена ──────────────────────
    # Бьём по двум проблемам: третий хост (s3.twcstorage.ru) — лишний
    # TLS handshake и иногда обрезается Opera Turbo / Data Saver на
    # Android. Через /media/ всё едет с того же origin'а, тем же
    # HTTP/2-соединением, с длинным Cache-Control (ключи immutable).
    location ^~ /media/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        proxy_pass https://s3.twcstorage.ru/heymessenger/;
        proxy_ssl_server_name on;
        proxy_set_header Host s3.twcstorage.ru;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header X-RGW-Object-Count;
        proxy_hide_header X-RGW-Bytes-Used;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

