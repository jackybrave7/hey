    # ── APK / .aab раздача ──────────────────────────────────────────
    # Без этого location SPA-fallback (try_files .../index.html) перехватит
    # GET /downloads/*.apk и отдаст HTML. Нужно явно указать что .apk —
    # бинарный файл с правильным mime, иначе Android отказывается ставить.
    location ^~ /downloads/ {
        root /app/web/dist;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream                 aab;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

