<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>

  <!-- ── Theme & UI ───────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#5F4080"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="format-detection" content="telephone=no"/>

  <!-- ── PWA / iOS ─────────────────────────────────────────────────────── -->
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <meta name="twitter:title" content="HEY Messenger — мессенджер для близкого круга"/>
  <meta name="twitter:description" content="Приватный мессенджер. Чаты, моменты, голосовые. Без рекламы."/>
  <meta name="twitter:image" content="https://hey-messenger.ru/og-image.svg"/>
  <meta name="twitter:image:alt" content="HEY Messenger"/>

  <!-- ── Robots ────────────────────────────────────────────────────────── -->
  <meta name="robots" content="index, follow, max-image-preview:large"/>
  <meta name="googlebot" content="index, follow"/>
  <meta name="yandex" content="index, follow"/>

  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet"/>

  <!-- ── Structured data (JSON-LD) ─────────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "HEY Messenger",
    "alternateName": "HEY",
    "url": "https://hey-messenger.ru/",
    "description": "Приватный мессенджер для близкого круга. Чаты, моменты, голосовые сообщения.",

    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "RUB"
    }

  <!-- ── Initial loading paint (избегаем белого экрана) ────────────────── -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a0a30; color: #F9F0F0; }
    body { font-family: 'Comfortaa', system-ui, -apple-system, sans-serif; }
    #root { min-height: 100vh; }
    .boot-splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#2a1058,#5F4080,#7c45c7);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .boot-splash svg { width: 52px; height: 52px; display: block; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-splash">
      <img src="/hey-logo.png" width="52" height="52" alt="" aria-hidden="true" />
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- noscript fallback -->
  <noscript>
    <div style="padding:40px;max-width:480px;margin:0 auto;text-align:center;">
      <h1 style="color:#F9F0F0;">HEY Messenger</h1>
      <p style="color:#d8c5f5;">Для работы приложения нужен JavaScript. Включи его в настройках браузера.</p>
    </div>

</body>
