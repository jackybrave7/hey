<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#2a1058"/>
      <stop offset="50%" stop-color="#5a2d96"/>
      <stop offset="100%" stop-color="#7c45c7"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5d4ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow stars -->
  <g opacity="0.25" fill="#ffffff">
    <circle cx="180" cy="120" r="3"/>
    <circle cx="1050" cy="180" r="4"/>
    <circle cx="1100" cy="480" r="3"/>
    <circle cx="120" cy="500" r="3"/>
    <circle cx="950" cy="80"  r="2"/>
    <circle cx="280" cy="540" r="2"/>
  </g>

  <!-- Central star -->
  <g transform="translate(600 245)" filter="url(#glow)">
    <path d="M0 -90 L20 -20 L90 0 L20 20 L0 90 L-20 20 L-90 0 L-20 -20 Z"
          fill="url(#star)"/>
  </g>

  <!-- Title -->
  <text x="600" y="430"
        font-family="Comfortaa, system-ui, -apple-system, sans-serif"
        font-size="92" font-weight="700" fill="#ffffff"
        text-anchor="middle" letter-spacing="6">
    HEY
  </text>
  <text x="600" y="490"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28" font-weight="500" fill="#d8c5f5"
        text-anchor="middle" letter-spacing="2">
    мессенджер для близкого круга
  </text>
  <text x="600" y="555"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="400" fill="#b89de0"
        text-anchor="middle" letter-spacing="1">
    Чаты · Моменты · Голосовые
  </text>
</svg>
