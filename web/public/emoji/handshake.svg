<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .cls-1{fill:#fbefd1;}
      .cls-2{fill:#846d9b;}
      .cls-3{fill:#c96fa1;opacity:0.5;}
      .cls-4{fill:#f3c98a;}
      .cls-5{fill:#e9b97a;}
      .cls-6{fill:#c96fa1;}
    </style>
  </defs>
  <title>handshake</title>
  <!-- основной кремовый круг -->
  <circle class="cls-1" cx="32" cy="32" r="29.7"/>
  <!-- розовые щёчки -->
  <ellipse class="cls-3" cx="47.4" cy="30" rx="6.28" ry="4.7"/>
  <ellipse class="cls-3" cx="16.6" cy="30" rx="6.28" ry="4.7"/>
  <!-- глаза: довольные дуги-полумесяцы (как у happy/sleeping) -->
  <path d="M15,22 Q20,17 25,22" fill="none" stroke="#846d9b" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M39,22 Q44,17 49,22" fill="none" stroke="#846d9b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- мягкая довольная улыбка -->
  <path d="M22,32 Q32,40 42,32" fill="none" stroke="#846d9b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- мини-жест «рукопожатие» в нижней части круга -->
  <g transform="translate(32 48)">
    <!-- левая рука (приходит слева) -->
    <rect class="cls-2" x="-16" y="-2" rx="2" ry="2" width="8" height="6" transform="rotate(-10)"/>
    <path class="cls-4" d="M-10,-3 Q-5,-5 0,-2 Q0,2 -3,3 Q-8,4 -11,2 Z"/>
    <!-- правая рука (приходит справа) -->
    <rect class="cls-6" x="8" y="-2" rx="2" ry="2" width="8" height="6" transform="rotate(10)"/>
    <path class="cls-5" d="M10,-3 Q5,-5 0,-2 Q0,2 3,3 Q8,4 11,2 Z"/>
    <!-- сцепление в центре (более тёмная тень) -->
    <ellipse cx="0" cy="0" rx="3.5" ry="2.5" fill="#c99a55" opacity=".55"/>
    <!-- линии-сгибы пальцев -->
    <line x1="-3" y1="1.5" x2="3" y2="1.5" stroke="#846d9b" stroke-width=".7" stroke-linecap="round" opacity=".6"/>
  </g>
</svg>
