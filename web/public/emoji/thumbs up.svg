<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg{fill:#fbefd1}
      .skin{fill:#f3c98a}
      .skin-dark{fill:#d9a866}
      .cuff{fill:#846d9b}
      .accent{fill:#c96fa1}
      .line{stroke:#846d9b;stroke-width:1.4;stroke-linecap:round;fill:none}
      .spark{fill:#c96fa1;opacity:.7}
    </style>
  </defs>
  <title>thumbs up</title>
  <!-- background cream circle -->
  <circle class="bg" cx="32" cy="32" r="29.7"/>
  <!-- approval sparks around -->
  <circle class="spark" cx="14" cy="20" r="1.6"/>
  <circle class="spark" cx="50" cy="18" r="2"/>
  <circle class="spark" cx="49" cy="48" r="1.4"/>
  <!-- thumb -->
  <path class="skin" d="M27 28 Q27 12, 34 11 Q40 11, 40 17 L40 24 L46 24 Q49 24, 49 27 Q49 30, 46 31 L40 31 Z"/>
  <!-- fist body -->
  <rect class="skin" x="22" y="30" rx="4" ry="4" width="22" height="20"/>
  <!-- finger separators (subtle curves) -->
  <path class="line" d="M24 36 Q28 35, 32 36 T42 36"/>
  <path class="line" d="M24 41 Q28 40, 32 41 T42 41"/>
  <path class="line" d="M24 46 Q28 45, 32 46 T42 46"/>
  <!-- shadow under fist (dark skin tone) -->
  <path class="skin-dark" d="M22 47 Q33 51, 44 47 L44 50 Q33 53, 22 50 Z" opacity=".55"/>
  <!-- wrist cuff -->
  <rect class="cuff" x="20" y="49" rx="3" ry="3" width="26" height="7"/>
  <!-- subtle highlight on cuff -->
  <rect fill="#a187c6" x="20" y="49" rx="3" ry="3" width="26" height="2.2" opacity=".7"/>
</svg>
